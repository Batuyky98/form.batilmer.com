# Bu dala her gönderimde: derle → testleri çalıştır (sunucuya DOKUNMAZ).
# Sunucuya kurulum SADECE elle başlatılınca olur: Actions → "Sunucuya gönder" → Run workflow
# (işletme sahibi görselleri onaylayınca). Testler geçmezse kurulum yapılmaz.
# Sunucu tarafı: deploy/otomatik-kur.sh (bir kez). Gerekli secret'lar:
#   SUNUCU_ADRES, SUNUCU_PARMAK_IZI, SUNUCU_ANAHTAR
name: Sunucuya gönder

on:
  push:
    branches: [claude/upbeat-galileo-qa75b3]
  workflow_dispatch:

concurrency:
  group: sunucu-canli
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix server
      - run: npm run build
      - run: npm test

  kur:
    needs: test
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Secret kontrolü
        env:
          ADRES: ${{ secrets.SUNUCU_ADRES }}
        run: |
          if [ -z "$ADRES" ]; then
            echo "::warning::Sunucu bilgileri girilmemiş; kurulum atlandı. Bkz. deploy/otomatik-kur.sh"
            echo "ATLA=1" >> "$GITHUB_ENV"
          fi
      - name: Paketle ve sunucuya kur
        if: env.ATLA != '1'
        env:
          ADRES: ${{ secrets.SUNUCU_ADRES }}
          PARMAK_IZI: ${{ secrets.SUNUCU_PARMAK_IZI }}
          ANAHTAR: ${{ secrets.SUNUCU_ANAHTAR }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$ANAHTAR" | tr -d '\r' > ~/.ssh/sunucu && chmod 600 ~/.ssh/sunucu
          ADRES="$(printf '%s' "$ADRES" | tr -d ' \r\n\t')"
          HOST="${ADRES%%:*}"; PORT=22
          [ "$HOST" != "$ADRES" ] && PORT="${ADRES##*:}"
          KH_HOST="$HOST"; [ "$PORT" != 22 ] && KH_HOST="[$HOST]:$PORT"
          # Parmak izinden sadece anahtar türü ve anahtarı al, adresi biz yazalım (kopyalarken oluşan farklar sorun olmasın)
          KEY="$(printf '%s\n' "$PARMAK_IZI" | tr -d '\r' | grep -oE 'ssh-ed25519 [A-Za-z0-9+/=]+' | head -1 || true)"
          if [ -n "$KEY" ]; then
            echo "$KH_HOST $KEY" > ~/.ssh/known_hosts
          else
            echo "::warning::SUNUCU_PARMAK_IZI okunamadı; sunucunun anahtarı ilk bağlantıda alınıyor. deploy/otomatik-kur.sh çıktısındaki 2. satırı secret'a yeniden girin."
            ssh-keyscan -p "$PORT" -t ed25519 "$HOST" 2>/dev/null > ~/.ssh/known_hosts
          fi
          git archive --format=zip --prefix=batilmer-form-paneli/ -o paket.zip HEAD
          ssh -i ~/.ssh/sunucu -p "$PORT" -o StrictHostKeyChecking=yes -o BatchMode=yes -o ServerAliveInterval=30 \
            "root@$HOST" < paket.zip
      - name: Canlı site kontrolü
        if: env.ATLA != '1'
        run: |
          for i in $(seq 1 20); do
            curl -sf -o /dev/null https://form.batilmer.com/ && { echo "✔ form.batilmer.com açık"; exit 0; }
            sleep 3
          done
          echo "::error::form.batilmer.com yanıt vermiyor"; exit 1
