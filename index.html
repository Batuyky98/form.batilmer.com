<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Batilmer Form Paneli</title>
  <link rel="icon" href="/batilmer-favicon.svg?v=1" type="image/svg+xml" />
  <link rel="shortcut icon" href="/batilmer-favicon.svg?v=1" />
  <!-- "Ana Ekrana Ekle" (iPhone'da bildirim için gerekli) -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="theme-color" content="#ffffff" />
  <!-- Tema, sayfa çizilmeden uygulanır (açılışta beyaz parlama olmasın) -->
  <script>try{if(localStorage.getItem('bf_tema')==='dark'&&!/^\/(f|iptal|test-sitesi)(\/|$)/.test(location.pathname)){document.documentElement.dataset.theme='dark';document.querySelector('meta[name="theme-color"]').setAttribute('content','#0a0f1c')}}catch(e){}</script>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="batilmer" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
</head>

</html>
